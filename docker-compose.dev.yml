services:
  api:
    build:
      context: .
      target: dev
    container_name: link-withu-local-api
    working_dir: /proj/api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      BASE_URL: ${BASE_URL:-http://localhost:5173}
      APP_NAME: ${APP_NAME:-Link WithU}
      RANDOM_CODE_LENGTH: ${RANDOM_CODE_LENGTH:-6}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      DATABASE_URL: sqlite:////proj/api/short_links.db
    ports:
      - "5201:5201"
    volumes:
      - ./api:/proj/api
      - api-target:/proj/api/target
      - cargo-registry:/usr/local/cargo/registry

  web:
    image: node:24-alpine
    container_name: link-withu-local-web
    working_dir: /proj/web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY: http://api:5201
    ports:
      - "5173:5173"
    volumes:
      - ./web:/proj/web
      - web-node-modules:/proj/web/node_modules

volumes:
  api-target:
  cargo-registry:
  web-node-modules:
