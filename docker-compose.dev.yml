services:
  link-withu:
    build: .
    image: link-withu:local
    container_name: link-withu-dev
    ports:
      - "5201:5201"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      BASE_URL: ${BASE_URL:-http://localhost:5201}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////proj/data/short_links.db}
      FRONTEND_DIST: ${FRONTEND_DIST:-/proj/web/dist}
    volumes:
      - ./data:/proj/data
