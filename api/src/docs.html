<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.svg">
    <title>Link WithU API</title>
  </head>
  <body>
    <div id="api-reference">正在加载接口文档…</div>
    <script type="module">
      try {
        const { createApiReference } = await import('https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.75.1/esm.js');
        createApiReference('#api-reference', {
          url: '/openapi.json',
          servers: [{ url: window.location.origin }],
          withDefaultFonts: false,
          persistAuth: false,
          showDeveloperTools: 'never',
          agent: { disabled: true },
        });
      } catch {
        document.querySelector('#api-reference').textContent = '接口文档加载失败，请检查网络；接口定义可通过 /openapi.json 获取。';
      }
    </script>
  </body>
</html>
