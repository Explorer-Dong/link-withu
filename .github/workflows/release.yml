name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: link-withu-release
  cancel-in-progress: ${{ github.event.forced == true }}

env:
  IMAGE: xwithu/link-withu

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable release and credentials
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/scripts/check_release.py

  build:
    needs: prepare
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      upload: true
    secrets: inherit

  publish:
    needs: [checks, prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested digests without rebuilding
        run: |
          python3 .github/scripts/verify_images.py references "$RUNNER_TEMP/digests" --image "$IMAGE" > "$RUNNER_TEMP/image-references.txt"
          mapfile -t references < "$RUNNER_TEMP/image-references.txt"
          docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" "${references[@]}"
      - name: Verify both tested architectures and latest tag
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw > "$RUNNER_TEMP/version-manifest.json"
          docker buildx imagetools inspect "$IMAGE:latest" --raw > "$RUNNER_TEMP/latest-manifest.json"
          python3 .github/scripts/verify_images.py verify "$RUNNER_TEMP/digests" \
            --version-manifest "$RUNNER_TEMP/version-manifest.json" \
            --latest-manifest "$RUNNER_TEMP/latest-manifest.json"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            echo "Release already exists; preserving its title and notes."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "v$VERSION" \
              --notes ""
          fi
