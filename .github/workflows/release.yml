name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: link-withu-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      IMAGE: xwithu/link-withu
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable release and credentials
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('A stable vMAJOR.MINOR.PATCH tag is required')
          version = tag[1:]
          with open('web/package.json') as f:
              assert json.load(f)['version'] == version, 'Frontend version mismatch'
          with open('api/pyproject.toml', 'rb') as f:
              assert tomllib.load(f)['project']['version'] == version, 'API version mismatch'
          assert os.environ.get('DOCKERHUB_USERNAME'), 'Configure DOCKERHUB_USERNAME in Actions secrets'
          assert os.environ.get('DOCKERHUB_TOKEN'), 'Configure DOCKERHUB_TOKEN in Actions secrets'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\n')
          PY
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and smoke test both architectures before publishing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            local_image="link-withu-smoke:$VERSION-$arch"
            docker buildx build --platform "linux/$arch" --load \
              --label "org.opencontainers.image.version=$VERSION" \
              --tag "$local_image" .
            docker run --rm -i --platform "linux/$arch" \
              --entrypoint /proj/api/.venv/bin/python \
              -e ADMIN_PASSWORD=ci-smoke-test-only \
              -e EXPECTED_VERSION="$VERSION" \
              "$local_image" - < .github/scripts/smoke.py
          done
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and upload amd64 + arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            xwithu/link-withu:${{ steps.version.outputs.version }}
            xwithu/link-withu:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Verify both architectures and latest tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > /tmp/build-manifest.json
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > /tmp/version-manifest.json
          docker buildx imagetools inspect "$IMAGE:latest" --raw > /tmp/latest-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path('/tmp/version-manifest.json').read_bytes()
          latest = Path('/tmp/latest-manifest.json').read_bytes()
          built = Path('/tmp/build-manifest.json').read_bytes()
          assert json.loads(built) == json.loads(version) == json.loads(latest), 'Version and latest must reference the tested build'
          manifest = json.loads(version)
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            echo "Release already exists; preserving its title and notes."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "v$VERSION" \
              --notes ""
          fi
