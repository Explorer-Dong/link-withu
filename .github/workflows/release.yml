name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: link-withu-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      IMAGE: xwithu/link-withu
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable release and credentials
        id: version
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .github/scripts/check_release.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and smoke test both architectures before publishing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            local_image="link-withu-smoke:v$VERSION-$arch"
            docker buildx build --platform "linux/$arch" --load \
              --label "org.opencontainers.image.version=$VERSION" \
              --tag "$local_image" .
            container_id=$(docker run -d --rm --platform "linux/$arch" \
              -p 127.0.0.1::5201 -e ADMIN_PASSWORD=ci-smoke-test-only "$local_image")
            trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
            port=$(docker inspect --format '{{ (index (index .NetworkSettings.Ports "5201/tcp") 0).HostPort }}' "$container_id")
            EXPECTED_VERSION="$VERSION" ADMIN_PASSWORD=ci-smoke-test-only \
              SMOKE_BASE_URL="http://127.0.0.1:$port" python3 .github/scripts/smoke.py
            docker exec "$container_id" /usr/local/bin/link-withu --healthcheck
            docker rm -f "$container_id"
            trap - EXIT
          done
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and upload amd64 + arm64
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            xwithu/link-withu:${{ steps.version.outputs.tag }}
            xwithu/link-withu:latest
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Verify both architectures and latest tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > /tmp/build-manifest.json
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw > /tmp/version-manifest.json
          docker buildx imagetools inspect "$IMAGE:latest" --raw > /tmp/latest-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path('/tmp/version-manifest.json').read_bytes()
          latest = Path('/tmp/latest-manifest.json').read_bytes()
          built = Path('/tmp/build-manifest.json').read_bytes()
          assert json.loads(built) == json.loads(version) == json.loads(latest), 'Version and latest must reference the tested build'
          manifest = json.loads(version)
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            echo "Release already exists; preserving its title and notes."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "v$VERSION" \
              --notes ""
          fi
