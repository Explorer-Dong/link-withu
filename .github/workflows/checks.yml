name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Install documentation dependencies
        run: npm ci --prefix .github/pages
      - name: Backend format and lint
        run: |
          cargo fmt --manifest-path api/Cargo.toml -- --check
          cargo clippy --manifest-path api/Cargo.toml --all-targets --locked -- -D warnings
      - name: Check frontend format
        run: |
          npm run format:check --prefix web
          web/node_modules/.bin/prettier --check .github/pages/build.mjs .github/pages/docs.js .github/pages/style.css
      - name: Build frontend
        run: npm run build --prefix web
      - name: API, migration and recovery tests
        run: cargo test --manifest-path api/Cargo.toml --locked
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Desktop and mobile browser tests
        run: npm run test:e2e --prefix web
      - name: Release validation and utility checks
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -m compileall -q .github/scripts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/
          retention-days: 7
